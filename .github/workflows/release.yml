name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux/arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: go build -o dist/minilab-dashboard-linux-arm64 ./cmd/app

      # Asset name must stay exactly minilab-dashboard-linux-arm64 --
      # install.sh and update.sh look it up by this exact name.
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/minilab-dashboard-linux-arm64 \
            --title "${{ github.ref_name }}" \
            --generate-notes
