# minilab-dashboard/Taskfile.yaml
version: '3'

dotenv: ['.env', '.env.dist']

tasks:
  build:
    desc: Cross-compile the binary for linux/arm64 (the deploy target)
    vars:
      ARCH: arm64
      OUTPUT_PATH: "./bin/minilab-dashboard"
      APPLICATION_PATH: "./cmd/app"
    cmds:
      - env GOOS=linux GOARCH={{.ARCH}} go build -o {{.OUTPUT_PATH}} {{.APPLICATION_PATH}}

  run:
    desc: Run the dashboard locally for testing (uses .env / .env.dist for config)
    cmds:
      - go run ./cmd/app

  install:
    desc: Install minilab-dashboard as a systemd service on this device (rocket)
    platforms: [linux/arm64]
    cmds:
      - ./scripts/install.sh

  update:
    desc: Update an existing minilab-dashboard install to the latest release
    platforms: [linux/arm64]
    cmds:
      - ./scripts/update.sh

  uninstall:
    desc: Remove minilab-dashboard from this device
    platforms: [linux/arm64]
    cmds:
      - ./scripts/uninstall.sh
